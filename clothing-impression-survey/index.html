<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>服の印象アンケート</title>

    <style>

        body {
            font-family: sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .description {
            line-height: 1.7;
        }

        .question {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .question img {
            display: block;
            width: 100%;
            max-width: 500px;
            max-height: 600px;
            object-fit: contain;
            margin: 20px auto;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            font-size: 16px;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #loading {
            text-align: center;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>服の印象アンケート</h1>

    <p class="description">
        表示された服の画像を見て、
        あなたが感じた印象を3つ入力してください。
    </p>

    <p class="description">
        正解はありません。
        画像を見て直感的に感じた言葉を入力してください。
    </p>


    <div id="loading">
        画像を読み込んでいます...
    </div>


    <div id="questions"></div>


    <button
        id="submitButton"
        onclick="submitAnswers()"
        style="display:none;"
    >
        回答を送信
    </button>


    <p id="message"></p>

</div>


<script>

    // ==================================
    // GitHubの設定
    // ==================================

    const GITHUB_USER =
        "あなたのGitHubユーザー名";

    const REPOSITORY =
        "clothing-impression-survey";

    const IMAGE_FOLDER =
        "images";


    // ==================================
    // GitHubから画像一覧を取得
    // ==================================

    async function getImages() {

        const url =
            `https://api.github.com/repos/${GITHUB_USER}/${REPOSITORY}/contents/${IMAGE_FOLDER}`;

        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "GitHubから画像一覧を取得できませんでした"
            );

        }


        const files =
            await response.json();


        // 画像だけを取り出す

        const imageFiles =
            files.filter(file => {

                return (
                    file.type === "file" &&
                    /\.(jpg|jpeg|png|gif|webp)$/i
                    .test(file.name)
                );

            });


        return imageFiles;

    }


    // ==================================
    // 配列をシャッフル
    // ==================================

    function shuffle(array) {

        const result =
            [...array];


        for (
            let i = result.length - 1;
            i > 0;
            i--
        ) {

            const j =
                Math.floor(
                    Math.random() * (i + 1)
                );


            [
                result[i],
                result[j]
            ] =
            [
                result[j],
                result[i]
            ];

        }


        return result;

    }


    // ==================================
    // ランダム5枚を表示
    // ==================================

    async function createQuestions() {

        const questions =
            document.getElementById(
                "questions"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        try {

            // GitHubから画像一覧取得

            const images =
                await getImages();


            console.log(
                "取得した画像数:",
                images.length
            );


            if (images.length < 5) {

                throw new Error(
                    "画像が5枚未満です"
                );

            }


            // ランダムに5枚

            const selectedImages =
                shuffle(images).slice(0, 5);


            // 5枚表示

            selectedImages.forEach(
                (image, index) => {

                    const question =
                        document.createElement(
                            "div"
                        );


                    question.className =
                        "question";


                    question.dataset.image =
                        image.name;


                    question.innerHTML = `

                        <h2>
                            画像 ${index + 1}
                        </h2>


                        <img
                            src="${image.download_url}"
                            alt="服の画像"
                        >


                        <label>
                            印象語 1
                        </label>

                        <input
                            type="text"
                            class="impression"
                            placeholder="例：かっこいい"
                        >


                        <label>
                            印象語 2
                        </label>

                        <input
                            type="text"
                            class="impression"
                            placeholder="例：おしゃれ"
                        >


                        <label>
                            印象語 3
                        </label>

                        <input
                            type="text"
                            class="impression"
                            placeholder="例：爽やか"
                        >

                    `;


                    questions.appendChild(
                        question
                    );

                }
            );


            loading.style.display =
                "none";


            document.getElementById(
                "submitButton"
            ).style.display =
                "block";


        } catch (error) {

            console.error(error);


            loading.textContent =
                "画像の読み込みに失敗しました。";


            console.error(error);

        }

    }


    // ==================================
    // 回答を取得
    // ==================================

    function submitAnswers() {

        const questions =
            document.querySelectorAll(
                ".question"
            );


        const answers = [];


        let incomplete = false;


        questions.forEach(question => {

            const image =
                question.dataset.image;


            const inputs =
                question.querySelectorAll(
                    ".impression"
                );


            const impression1 =
                inputs[0].value.trim();


            const impression2 =
                inputs[1].value.trim();


            const impression3 =
                inputs[2].value.trim();


            if (
                impression1 === "" ||
                impression2 === "" ||
                impression3 === ""
            ) {

                incomplete = true;

            }


            answers.push({

                image: image,

                impression1:
                    impression1,

                impression2:
                    impression2,

                impression3:
                    impression3

            });

        });


        if (incomplete) {

            alert(
                "すべての印象語を入力してください。"
            );

            return;

        }


        console.log(
            "回答:",
            answers
        );


        alert(
            "回答データを取得しました。"
        );

    }


    // ==================================
    // ページ読み込み時に実行
    // ==================================

    window.onload =
        createQuestions;

</script>


</body>

</html>
